name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analytics-identity:
    name: Verify PostHog identity and consent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web-app
      - name: Exercise the real SDK with synthetic identities and intercepted requests
        run: npx playwright test e2e/analytics-identity.spec.ts e2e/analytics-consent.spec.ts --project=chromium
        working-directory: apps/web-app
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_consent_fixture
          NEXT_PUBLIC_POSTHOG_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: analytics-identity-failure
          path: |
            apps/web-app/test-results
            apps/web-app/playwright-report
          retention-days: 7
  web:
    name: Verify source and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify critical source files and encoding
        run: npm run verify:source
      - name: Test dependency audit guard
        run: npm run test:dependency-audit -w @okado/web-app
      - name: Audit production dependencies in both apps
        run: npm run check:dependencies
      - name: Lint web app
        run: npm run lint:web
      - name: Test analytics consent in both apps and server capture
        run: npm run test:analytics-consent -w @okado/web-app
      - name: Test historical personal data lifecycle in isolated PostgreSQL
        run: npm run test:data-lifecycle -w @okado/web-app
      - name: Test administrator campaign permissions
        run: npm run test:admin-campaigns -w @okado/web-app
      - name: Test authenticated preview QR and scoped test tokens
        run: npm run test:preview-qr -w @okado/web-app
      - name: Test merchant gain notifications and RLS
        run: npm run test:gain-notifications -w @okado/web-app
      - name: Test Resend webhook signatures and storage errors
        run: npm run test:resend-webhook -w @okado/web-app
      - name: Test Beauty suggestion catalog and migration
        run: npm run test:beauty-catalog -w @okado/web-app
      - name: Test administrator establishment profiles
        run: npm run test:admin-profiles -w @okado/web-app
      - name: Test support email incident permissions and migration
        run: npm run test:support-incidents -w @okado/web-app
      - name: Test metric consistency and private SQL aggregates
        run: npm run test:metrics -w @okado/web-app
      - name: Test merchant page reads, session isolation and private timings
        run: npm run test:page-performance -w @okado/web-app
      - name: Build web app
        run: npm run build:web
      - name: Smoke compiled Resend webhook with isolated local storage
        run: npm run smoke:resend-webhook -w @okado/web-app

  landing:
    name: Verify landing page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint landing page
        run: npm run lint:landing
      - name: Build landing page
        run: npm run build:landing
