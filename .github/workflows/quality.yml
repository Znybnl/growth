name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-1280:
    name: Visual checks at 1280px
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web-app
      - name: Verify 1280px screens and capture evidence
        run: npm run test:visual-1280 -w @okado/web-app
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_consent_fixture
          NEXT_PUBLIC_POSTHOG_ENABLED: "true"
      - name: Verify Christmas templates on mobile, rotation and scratch gestures
        run: npx playwright test e2e/christmas-wheels.spec.ts e2e/christmas-scratch.spec.ts e2e/christmas-background-coverage.spec.ts --grep-invert @visual-1280 --output=test-results/christmas
        working-directory: apps/web-app
      - name: Verify affiliate account card and administration on mobile
        run: npx playwright test e2e/affiliate-accounts.spec.ts --grep-invert @visual-1280 --output=test-results/affiliate-mobile
        working-directory: apps/web-app
      - name: Upload visual evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-1280
          path: |
            apps/web-app/test-results
            apps/web-app/playwright-report
          retention-days: 7
  analytics-identity:
    name: Verify PostHog identity and consent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web-app
      - name: Exercise the real SDK with synthetic identities and intercepted requests
        run: npx playwright test e2e/analytics-identity.spec.ts e2e/analytics-consent.spec.ts e2e/onboarding-tracking.spec.ts e2e/cookie-menu-placement.spec.ts e2e/analytics-coverage.spec.ts e2e/beta-replay.spec.ts --project=chromium
        working-directory: apps/web-app
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_consent_fixture
          NEXT_PUBLIC_POSTHOG_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: analytics-identity-failure
          path: |
            apps/web-app/test-results
            apps/web-app/playwright-report
          retention-days: 7
  web:
    name: Verify source and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify critical source files and encoding
        run: npm run verify:source
      - name: Test aggregate acquisition audit without external requests
        run: node --test scripts/conversion-audit-results.test.mjs
      - name: Test dependency audit guard
        run: npm run test:dependency-audit -w @okado/web-app
      - name: Test every configured wheel reward and exact drawn result stays visible
        run: npm run test:wheel-segments -w @okado/web-app
      - name: Test Christmas template settings, backgrounds and contrast
        run: npm run test:christmas-wheels -w @okado/web-app
      - name: Test Christmas scratch templates, original foils and manual backgrounds
        run: npm run test:christmas-scratch -w @okado/web-app
      - name: Test guaranteed draw weights, stock and private SQL functions
        run: npm run test:guaranteed-draw -w @okado/web-app
      - name: Test Google click acceptance versions, API and private SQL controls
        run: npm run test:google-click -w @okado/web-app
      - name: Audit production dependencies in both apps
        run: npm run check:dependencies
      - name: Audit development tooling without exceptions
        run: npm run check:dependencies:all
      - name: Lint web app
        run: npm run lint:web
      - name: Test analytics consent in both apps and server capture
        run: npm run test:analytics-consent -w @okado/web-app
      - name: Verify closed-beta replay phase, private server policy and masking
        run: npm run test:beta-replay -w @okado/web-app
      - name: Verify analytics coverage for every application route
        run: npm run test:analytics-routes -w @okado/web-app
      - name: Test Google signup capture and authenticated onboarding tracking
        run: npm run test:onboarding-tracking -w @okado/web-app
      - name: Test historical personal data lifecycle in isolated PostgreSQL
        run: npm run test:data-lifecycle -w @okado/web-app
      - name: Test administrator campaign permissions
        run: npm run test:admin-campaigns -w @okado/web-app
      - name: Test authenticated preview QR and scoped test tokens
        run: npm run test:preview-qr -w @okado/web-app
      - name: Test new poster defaults and retained template choices
        run: npm run test:poster-defaults -w @okado/web-app
      - name: Test poster subtitle layout and centered Botanical QR
        run: npm run test:poster-composition -w @okado/web-app
      - name: Test merchant gain notifications and RLS
        run: npm run test:gain-notifications -w @okado/web-app
      - name: Test Resend webhook signatures and storage errors
        run: npm run test:resend-webhook -w @okado/web-app
      - name: Test Beauty suggestion catalog and migration
        run: npm run test:beauty-catalog -w @okado/web-app
      - name: Test general Beauty catalog presentation filters
        run: npm run test:prize-suggestion-filters -w @okado/web-app
      - name: Test reusable prize scope and independent copies
        run: npm run test:reusable-prizes -w @okado/web-app
      - name: Test activity prize compositions and independent copies
        run: npm run test:prize-compositions -w @okado/web-app
      - name: Test prize budget and missing-cost persistence
        run: npm run test:prize-budget -w @okado/web-app
      - name: Test administrator establishment profiles
        run: npm run test:admin-profiles -w @okado/web-app
      - name: Test administrator last sign-in source and permissions
        run: npm run test:admin-last-sign-in -w @okado/web-app
      - name: Admin account and establishment counts
        run: npm run test:admin-account-counts -w @okado/web-app
      - name: Test support email incident permissions and migration
        run: npm run test:support-incidents -w @okado/web-app
      - name: Test metric consistency and private SQL aggregates
        run: npm run test:metrics -w @okado/web-app
      - name: Test merchant page reads, session isolation and private timings
        run: npm run test:page-performance -w @okado/web-app
      - name: Test anonymous draw preparation timings and percentile report
        run: npm run test:draw-preparation -w @okado/web-app
      - name: Test merchant account affiliation, permissions, resubscription and migration
        run: npm run test:affiliates -w @okado/web-app
      - name: Build web app
        run: npm run build:web
      - name: Verify prize library with compiled production CSS
        run: |
          npx playwright install --with-deps chromium
          npm run smoke:prize-library -w @okado/web-app
      - name: Smoke compiled Resend webhook with isolated local storage
        run: npm run smoke:resend-webhook -w @okado/web-app

  landing:
    name: Verify landing page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint landing page
        run: npm run lint:landing
      - name: Build landing page
        run: npm run build:landing
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_consent_fixture
          NEXT_PUBLIC_POSTHOG_ENABLED: "true"
      - name: Install landing browser
        run: npx playwright install --with-deps chromium
      - name: Verify deferred loading, demo and consent
        working-directory: apps/landing-page
        run: npx playwright test e2e/mobile-performance.spec.ts e2e/landing-demo.spec.ts e2e/multisector-demo.spec.ts e2e/analytics-consent.spec.ts --project=desktop --project=mobile
      - name: Preserve landing test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser-evidence
          path: apps/landing-page/test-results
