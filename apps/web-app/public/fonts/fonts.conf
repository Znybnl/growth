<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir prefix="relative">poster</dir>
  <alias>
    <family>Anton</family>
    <prefer>
      <family>Anton</family>
      <family>Inter</family>
      <family>Geist</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Anton</family>
      <family>Inter</family>
      <family>Geist</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Arial</family>
    </prefer>
  </alias>
  <alias>
    <family>Inter</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
  <alias>
    <family>Geist</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
</fontconfig>
